<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <nav><h1>Tracker</h1></nav> 
  <main>
    <div class="actions">
      <label for="name-input">Add Animes</label>
      <div class="input-row">
        <input type="text" id="name-input" placeholder="Enter Name of Anime">
        <input type="text" id="rating-input" placeholder="1-10">
        <button type="button" id="confirm-add">Confirm</button> 
      </div>
      <div class="all-animes"></div>
    </div>

  </main>
</body>
</html>
